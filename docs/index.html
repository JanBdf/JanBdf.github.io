<!DOCTYPE html>

<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>TAG am GSP</title>
        <link rel="stylesheet" href="./style/style.css">
        <link rel="icon" type="image/x-icon" href="./resc/img/icon.png">
        <script src="scripts/index.js" type="module"></script>
        <script src="scripts/countdown.js"></script>
    </head>
    <body>
        <div id="top"></div>

        <div class="header">
            <div class="greeter-bg"></div>
            <div class="sidebar">
                <div class="btn-close"></div>
            </div>
            <div class="navbar">
                <div class="btn-sidebar"></div>
                <div class="spacer"></div>
                <div class="btn-projects"></div>
                <div class="btn-contact"></div>
            </div>
            <div class="centered">
                <div class="container">
                    <p class="braces">&lt;</p>
                    <p class="title">TAG&emsp14;</p>
                    <a class="slash" href="https://gymnasium-ploen.de">/</a>
                    <p class="braces">&gt;</p>
                </div>
                <div class="block">
                    Technik AG - Gymnasium Schloss Plön
                </div>
                
                <div id="countdown" class="countdown-container">
                    <div class="countdown-title">Nächstes Event in:</div>
                    <div class="countdown-timer">
                        <div class="countdown-unit">
                            <div class="countdown-value" id="days">00</div>
                            <div class="countdown-label">Tage</div>
                        </div>
                        <div class="countdown-separator">:</div>
                        <div class="countdown-unit">
                            <div class="countdown-value" id="hours">00</div>
                            <div class="countdown-label">Stunden</div>
                        </div>
                        <div class="countdown-separator">:</div>
                        <div class="countdown-unit">
                            <div class="countdown-value" id="minutes">00</div>
                            <div class="countdown-label">Minuten</div>
                        </div>
                        <div class="countdown-separator">:</div>
                        <div class="countdown-unit">
                            <div class="countdown-value" id="seconds">00</div>
                            <div class="countdown-label">Sekunden</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="section">
            <section class="footer">
                <p>&copy; 2026&emsp;Website Design by Jan Bittendorf</p>
            </section>
        </section>
    </body>
</html>
